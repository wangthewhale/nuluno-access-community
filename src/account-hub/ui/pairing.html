<body><header class="topbar"><span class="wordmark"><span class="brand-mark" aria-hidden="true">n</span>Nuluno <span>Access</span></span><span class="preview-label">本機單人安裝</span></header><main class="pairing-main"><p class="eyebrow">本人啟用</p><h1>啟用這台裝置。</h1><p class="lead">使用安裝時產生的短效連結，確認你可以管理這個服務。<br>啟用前，不會開放你的帳號資訊或操作權限。</p><section class="project-bar"><div><strong>只需要完成一次</strong><p id="pairing-status" class="provider-note" role="status" aria-live="polite">正在檢查啟用連結…</p><button id="activate-owner" class="primary-button" type="button" disabled>啟用並開啟帳號中心</button></div></section><p class="storage-note">連結只能使用一次，五分鐘後到期。這不是平台密碼，也不是雲端會員登入。</p><details class="advanced"><summary>沒有可用的啟用連結？</summary><p>請在安裝這個服務的本人終端執行 <code>nuluno-access-hub pair</code> 取得新連結。請勿把連結交給其他人、AI agent 或放進公開紀錄。</p></details></main></body></html>
